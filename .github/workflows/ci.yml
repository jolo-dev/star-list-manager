name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          EXTENSION_PUBLIC_GITHUB_CLIENT_ID: test-public-client-id
          NODE_OPTIONS: ''
